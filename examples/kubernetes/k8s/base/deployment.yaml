apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  annotations:
    # With Stakater Reloader installed, pods restart when the config Secret changes
    # (for example after a Token Vault key rotation). Without it: kubectl rollout restart.
    secret.reloader.stakater.com/reload: orders-api-config
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: orders-api }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: orders-api }
    spec:
      serviceAccountName: orders-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 20
      containers:
        - name: app
          image: registry.example.com/orders-api:1.0.0
          ports:
            - { name: http, containerPort: 8080 }
          # Every key of the Secret becomes an environment variable at boot:
          # DATABASE_URL, TOKEN_VAULT_API_KEY, SLACK_INTEGRATION_ID, SLACK_CHANNEL.
          # No provider credential (Slack, Stripe, GitHub …) is ever in this Secret.
          envFrom:
            - secretRef: { name: orders-api-config }
          env:
            - { name: TOKEN_VAULT_URL, value: "https://tokenvault.internal" }
            - { name: PORT, value: "8080" }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 15
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
