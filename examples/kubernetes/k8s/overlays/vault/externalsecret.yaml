# Copies secret/orders-api from Vault into the Kubernetes Secret "orders-api-config", which the
# Deployment loads as environment variables at boot. Refreshed hourly: after a Token Vault key
# rotation, the new key arrives here and Reloader restarts the pods while the old key is still
# within its grace period, so no request fails.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: orders-api-config
  namespace: orders
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: orders-api-config
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: orders-api
