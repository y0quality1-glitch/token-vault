# How External Secrets reaches Vault: as the pod's own service account (no static token).
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault
  namespace: orders
spec:
  provider:
    vault:
      server: https://vault.internal:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: orders-api
          serviceAccountRef:
            name: orders-api
