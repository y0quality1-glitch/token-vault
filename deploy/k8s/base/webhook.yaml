# Customer webhook (vault runtime): the only component that decrypts provider credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: webhook
  namespace: token-vault-customer
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook
  namespace: token-vault-customer
  annotations:
    # With Stakater Reloader, pods restart when their Secret changes (rotations).
    secret.reloader.stakater.com/reload: token-vault-webhook
spec:
  # One replica: OAuth token refreshes are coordinated in-process (roadmap 1.5). Recreate avoids two versions migrating at once.
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: webhook }
  template:
    metadata:
      labels: { app.kubernetes.io/name: webhook }
    spec:
      serviceAccountName: webhook
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 20
      containers:
        - name: webhook
          image: token-vault/webhook
          ports:
            - { name: http, containerPort: 4100 }
          # Secrets (database URL with its password, keys) come from the Secret; plain settings below.
          envFrom:
            - secretRef: { name: token-vault-webhook }
          env:
            - { name: PORT, value: "4100" }
            - { name: CMS_CATALOG_URL, value: "http://cms-api.token-vault.svc.cluster.local:4200/catalog/v1" }
            - { name: UPSTREAM_MODE, value: "mock" }
            - { name: PROVIDER_MODES, value: "" }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 16Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: webhook
  namespace: token-vault-customer
spec:
  selector: { app.kubernetes.io/name: webhook }
  ports:
    - { name: http, port: 4100, targetPort: http }
