# Provider CMS API: signs published definitions and serves the public catalog.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cms-api
  namespace: token-vault
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cms-api
  namespace: token-vault
  annotations:
    # With Stakater Reloader, pods restart when their Secret changes (rotations).
    secret.reloader.stakater.com/reload: token-vault-cms-api
spec:
  # One replica: migrations run at start-up and rate limits are per process (roadmap 1.5). Recreate avoids two versions migrating at once.
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: cms-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: cms-api }
    spec:
      serviceAccountName: cms-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 20
      containers:
        - name: cms-api
          image: token-vault/cms-api
          ports:
            - { name: http, containerPort: 4200 }
          # Secrets (database URL with its password, keys) come from the Secret; plain settings below.
          envFrom:
            - secretRef: { name: token-vault-cms-api }
          env:
            - { name: PORT, value: "4200" }
            - { name: CMS_ADMIN_DIRECT_PUBLISH, value: "false" }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 16Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: cms-api
  namespace: token-vault
spec:
  selector: { app.kubernetes.io/name: cms-api }
  ports:
    - { name: http, port: 4200, targetPort: http }
