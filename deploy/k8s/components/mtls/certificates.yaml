# Your CA, as a cert-manager ClusterIssuer: put the CA certificate and key in a Secret named
# token-vault-webhook-ca in cert-manager's namespace (tls.crt / tls.key), or point issuerRef
# below at an issuer you already have (Vault PKI, an intermediate CA, ...).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: token-vault-webhook-ca
spec:
  ca:
    secretName: token-vault-webhook-ca
---
# The webhook's server certificate: names the control plane uses to reach it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: webhook-tls
  namespace: token-vault-customer
spec:
  secretName: webhook-tls
  duration: 2160h
  renewBefore: 360h
  privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Always }
  usages: [server auth, digital signature]
  dnsNames:
    - webhook.token-vault-customer.svc
    - webhook.token-vault-customer.svc.cluster.local
  issuerRef: { name: token-vault-webhook-ca, kind: ClusterIssuer, group: cert-manager.io }
---
# The control plane's client certificate: its identity is the SPIFFE ID the webhook allows.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: control-plane-tls
  namespace: token-vault
spec:
  secretName: control-plane-tls
  duration: 2160h
  renewBefore: 360h
  privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Always }
  usages: [client auth, digital signature]
  commonName: control-plane
  uris: [spiffe://token-vault/control-plane]
  issuerRef: { name: token-vault-webhook-ca, kind: ClusterIssuer, group: cert-manager.io }
