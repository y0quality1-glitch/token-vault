# Local only: one PostgreSQL for the three databases (one role each). Use a managed database,
# and a separate one for the customer webhook, anywhere else.
apiVersion: v1
kind: Namespace
metadata:
  name: token-vault-data
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: token-vault-data
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - { name: postgres, containerPort: 5432 }
          envFrom:
            - secretRef: { name: postgres }
          env:
            - { name: POSTGRES_USER, value: postgres }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres", "-d", "token_vault_cms"] }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: initdb, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      volumes:
        - name: initdb
          configMap: { name: postgres-initdb, defaultMode: 0555 }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: token-vault-data
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
