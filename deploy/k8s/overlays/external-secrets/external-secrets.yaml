# Control plane: database URL, webhook signing secret, audit key, pinned CMS public key.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: token-vault-server
  namespace: token-vault
spec:
  refreshInterval: 1h
  secretStoreRef: { name: token-vault, kind: ClusterSecretStore }
  target:
    name: token-vault-server
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract: { key: token-vault/server }
---
# Customer webhook: its database URL, the signing secret and the credential encryption key.
# deletionPolicy Retain: deleting this resource must never delete the key to the stored credentials.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: token-vault-webhook
  namespace: token-vault-customer
spec:
  refreshInterval: 1h
  secretStoreRef: { name: token-vault, kind: ClusterSecretStore }
  target:
    name: token-vault-webhook
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract: { key: token-vault/webhook }
---
# Provider CMS: its database URL and the Ed25519 signing key.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: token-vault-cms-api
  namespace: token-vault
spec:
  refreshInterval: 1h
  secretStoreRef: { name: token-vault, kind: ClusterSecretStore }
  target:
    name: token-vault-cms-api
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract: { key: token-vault/cms-api }
