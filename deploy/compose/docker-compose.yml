# Token Vault, full stack, for a single host (evaluation, demos, staging).
#
#   node deploy/compose/generate-env.mjs                                  # once: secrets in deploy/compose/.env
#   docker compose -f deploy/compose/docker-compose.yml up -d --build     # build images and start
#
# Behind a registry mirror: NODE_IMAGE, NGINX_IMAGE and POSTGRES_IMAGE override the base images.
#
# Console http://localhost:8080 (agents: TOKEN_VAULT_URL=http://localhost:8080)
# CMS     http://localhost:8081
#
# Networks mirror the trust zones: the databases, the catalog and the control plane <-> webhook
# link are internal (no outside access); only the two UIs are published, and only the customer
# webhook can reach the internet (needed for live provider calls). One PostgreSQL server holds
# the three databases here, with a separate role each; in production give the customer webhook
# its own database server, in the customer's environment.
name: token-vault

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  tmpfs: [/tmp]

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run node deploy/compose/generate-env.mjs first}
      CONTROL_PLANE_DB_PASSWORD: ${CONTROL_PLANE_DB_PASSWORD}
      WEBHOOK_DB_PASSWORD: ${WEBHOOK_DB_PASSWORD}
      CMS_DB_PASSWORD: ${CMS_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d token_vault_cms"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [data]

  cms-api:
    <<: *hardened
    image: ${REGISTRY:-token-vault}/cms-api:${TAG:-dev}
    build: { context: ../.., dockerfile: deploy/docker/service.Dockerfile, args: { SERVICE: cms/api, NODE_IMAGE: "${NODE_IMAGE:-node:22-alpine}" } }
    environment:
      PORT: "4200"
      CMS_DATABASE_URL: postgres://token_vault_cms:${CMS_DB_PASSWORD}@postgres:5432/token_vault_cms
      CMS_SIGNING_PRIVATE_KEY: ${CMS_SIGNING_PRIVATE_KEY}
      CMS_ADMIN_DIRECT_PUBLISH: ${CMS_ADMIN_DIRECT_PUBLISH:-true}
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck: &http-health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4200/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [data, catalog, control]

  webhook:
    <<: *hardened
    image: ${REGISTRY:-token-vault}/webhook:${TAG:-dev}
    build: { context: ../.., dockerfile: deploy/docker/service.Dockerfile, args: { SERVICE: webhook, NODE_IMAGE: "${NODE_IMAGE:-node:22-alpine}" } }
    environment:
      PORT: "4100"
      WEBHOOK_DATABASE_URL: postgres://token_vault_customer:${WEBHOOK_DB_PASSWORD}@postgres:5432/token_vault_customer
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET}
      WEBHOOK_PREVIOUS_SIGNING_SECRETS: ${WEBHOOK_PREVIOUS_SIGNING_SECRETS:-}
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY}
      VAULT_PREVIOUS_ENCRYPTION_KEYS: ${VAULT_PREVIOUS_ENCRYPTION_KEYS:-}
      # env (default) or a KMS: aws-kms (KMS_KEY_ID, AWS_REGION) or vault-transit (see vault-transit.yml)
      VAULT_KEY_PROVIDER: ${VAULT_KEY_PROVIDER:-env}
      KMS_KEY_ID: ${KMS_KEY_ID:-}
      AWS_REGION: ${AWS_REGION:-}
      # Identity pinned by the control plane (the seeded demo webhook expects the default id).
      WEBHOOK_INSTANCE_ID: ${WEBHOOK_INSTANCE_ID:-whi_local_customer_vault}
      UPSTREAM_MODE: ${UPSTREAM_MODE:-mock}
      PROVIDER_MODES: ${PROVIDER_MODES:-}
      CMS_CATALOG_URL: http://cms-api:4200/catalog/v1
      CMS_PUBLIC_KEY: ${CMS_PUBLIC_KEY}
    depends_on: { postgres: { condition: service_healthy }, cms-api: { condition: service_healthy } }
    healthcheck:
      <<: *http-health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4100/healthz"]
    networks: [data, catalog, customer, egress]

  server:
    <<: *hardened
    image: ${REGISTRY:-token-vault}/server:${TAG:-dev}
    build: { context: ../.., dockerfile: deploy/docker/service.Dockerfile, args: { SERVICE: server, NODE_IMAGE: "${NODE_IMAGE:-node:22-alpine}" } }
    environment:
      PORT: "4000"
      DATABASE_URL: postgres://token_vault:${CONTROL_PLANE_DB_PASSWORD}@postgres:5432/token_vault
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET}
      WEBHOOK_PREVIOUS_SIGNING_SECRETS: ${WEBHOOK_PREVIOUS_SIGNING_SECRETS:-}
      AUDIT_SIGNING_KEY: ${AUDIT_SIGNING_KEY}
      DEFAULT_WEBHOOK_URL: http://webhook:4100
      CMS_CATALOG_URL: http://cms-api:4200/catalog/v1
      CMS_PUBLIC_KEY: ${CMS_PUBLIC_KEY}
      CONSOLE_PUBLIC_URL: ${CONSOLE_PUBLIC_URL:-http://localhost:8080}
    depends_on: { postgres: { condition: service_healthy }, webhook: { condition: service_healthy }, cms-api: { condition: service_healthy } }
    healthcheck:
      <<: *http-health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/healthz"]
    networks: [data, catalog, customer, control]

  console:
    <<: *hardened
    image: ${REGISTRY:-token-vault}/console:${TAG:-dev}
    build: { context: ../.., dockerfile: deploy/docker/web.Dockerfile, args: { APP: client, NODE_IMAGE: "${NODE_IMAGE:-node:22-alpine}", NGINX_IMAGE: "${NGINX_IMAGE:-nginxinc/nginx-unprivileged:1.27-alpine}" } }
    environment:
      API_UPSTREAM: http://server:4000
    # nginx renders its config into conf.d at start: writable for the nginx user (uid 101) only.
    tmpfs: ["/tmp", "/etc/nginx/conf.d:uid=101,gid=101,mode=0755"]
    ports: ["${CONSOLE_PORT:-8080}:8080"]
    depends_on: { server: { condition: service_healthy } }
    healthcheck:
      <<: *http-health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
    networks: [control, edge]

  cms-ui:
    <<: *hardened
    image: ${REGISTRY:-token-vault}/cms-ui:${TAG:-dev}
    build: { context: ../.., dockerfile: deploy/docker/web.Dockerfile, args: { APP: cms/client, NODE_IMAGE: "${NODE_IMAGE:-node:22-alpine}", NGINX_IMAGE: "${NGINX_IMAGE:-nginxinc/nginx-unprivileged:1.27-alpine}" } }
    environment:
      CMS_API_UPSTREAM: http://cms-api:4200
    # nginx renders its config into conf.d at start: writable for the nginx user (uid 101) only.
    tmpfs: ["/tmp", "/etc/nginx/conf.d:uid=101,gid=101,mode=0755"]
    ports: ["${CMS_PORT:-8081}:8080"]
    depends_on: { cms-api: { condition: service_healthy } }
    healthcheck:
      <<: *http-health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
    networks: [control, edge]

networks:
  data: { internal: true }      # databases
  catalog: { internal: true }   # signed provider catalog (CMS -> control plane, webhook)
  customer: { internal: true }  # control plane -> customer webhook (signed requests)
  control: { internal: true }   # UIs -> their APIs
  edge: {}                      # published UI ports
  egress: {}                    # customer webhook -> provider APIs (live mode)

volumes:
  pgdata:
