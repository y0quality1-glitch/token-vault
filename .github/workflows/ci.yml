name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, unit + database tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: token_vault
          POSTGRES_PASSWORD: token_vault
          POSTGRES_DB: token_vault_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U token_vault -d token_vault_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://token_vault:token_vault@localhost:5432/token_vault_test
      WEBHOOK_TEST_DATABASE_URL: postgres://token_vault_customer:token_vault_customer@localhost:5432/token_vault_customer_test
      CMS_TEST_DATABASE_URL: postgres://token_vault_cms:token_vault_cms@localhost:5432/token_vault_cms_test
    steps:
      - uses: actions/checkout@v4
      - name: Create customer-zone and CMS roles and databases
        run: psql -h localhost -U token_vault -d postgres -v ON_ERROR_STOP=1 -f scripts/pg-init.sql
        env:
          PGPASSWORD: token_vault
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (demo script + scenarios)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: token_vault
          POSTGRES_PASSWORD: token_vault
          POSTGRES_DB: token_vault_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U token_vault -d token_vault_e2e"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      E2E_DATABASE_URL: postgres://token_vault:token_vault@localhost:5432/token_vault_e2e
      E2E_WEBHOOK_DATABASE_URL: postgres://token_vault_customer:token_vault_customer@localhost:5432/token_vault_customer_e2e
      E2E_CMS_DATABASE_URL: postgres://token_vault_cms:token_vault_cms@localhost:5432/token_vault_cms_e2e
    steps:
      - uses: actions/checkout@v4
      - name: Create customer-zone and CMS roles and databases
        run: psql -h localhost -U token_vault -d postgres -v ON_ERROR_STOP=1 -f scripts/pg-init.sql
        env:
          PGPASSWORD: token_vault
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx -w e2e playwright install --with-deps chromium
      # Secrets are generated per run inside playwright.config.ts and passed to the
      # services as runtime environment variables. No .env files are written.
      - name: Run end-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report and service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/.logs/*.log
          retention-days: 7

  kms:
    name: Key management (Vault Transit, AWS KMS)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: token_vault
          POSTGRES_PASSWORD: token_vault
          POSTGRES_DB: token_vault_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U token_vault -d token_vault_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      vault:
        image: hashicorp/vault:1.17
        env:
          VAULT_DEV_ROOT_TOKEN_ID: ci-dev-root-token
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports: ['8200:8200']
        options: --cap-add=IPC_LOCK
      localstack:
        image: localstack/localstack:3.8
        env:
          SERVICES: kms
        ports: ['4566:4566']
    env:
      WEBHOOK_TEST_DATABASE_URL: postgres://token_vault_customer:token_vault_customer@localhost:5432/token_vault_customer_test
      VAULT_TEST_ADDR: http://localhost:8200
      VAULT_TEST_TOKEN: ci-dev-root-token
      KMS_TEST_ENDPOINT: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - name: Create customer-zone and CMS roles and databases
        run: psql -h localhost -U token_vault -d postgres -v ON_ERROR_STOP=1 -f scripts/pg-init.sql
        env:
          PGPASSWORD: token_vault
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wait for Vault and LocalStack
        run: |
          for i in $(seq 1 60); do curl -sf localhost:8200/v1/sys/health >/dev/null && curl -sf localhost:4566/_localstack/health | grep -q '"kms": "\(available\|running\)"' && exit 0; sleep 2; done
          echo "key services did not start"; exit 1
      # Includes the provider tests against real Vault Transit and the KMS API, and the store's move from an env key to each.
      - name: Webhook tests with the key services
        run: npm test -w webhook

  deploy:
    name: Images, compose smoke test, Kubernetes manifests
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f deploy/compose/docker-compose.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kubernetes manifests (kustomize, kubeconform, semantic checks)
        run: |
          node deploy/k8s/overlays/local/generate-secrets.mjs
          cp examples/kubernetes/k8s/overlays/local/config.env.example examples/kubernetes/k8s/overlays/local/config.env
          cmp deploy/compose/initdb/10-token-vault.sh deploy/k8s/overlays/local/postgres/10-token-vault.sh
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          pip install --quiet pyyaml==6.0.2
          for c in aws-kms vault-transit; do
            mkdir -p deploy/k8s/.ci-$c
            printf 'apiVersion: kustomize.config.k8s.io/v1beta1\nkind: Kustomization\nresources: [../overlays/external-secrets]\ncomponents: [../components/%s]\n' $c > deploy/k8s/.ci-$c/kustomization.yaml
          done
          for o in deploy/k8s/overlays/external-secrets deploy/k8s/overlays/local deploy/k8s/.ci-aws-kms deploy/k8s/.ci-vault-transit examples/kubernetes/k8s/overlays/vault examples/kubernetes/k8s/overlays/local; do
            echo "== $o"
            kubectl kustomize "$o" > rendered.yaml
            ./kubeconform -strict -summary -kubernetes-version 1.31.0 -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' rendered.yaml
            python3 deploy/k8s/check-manifests.py < rendered.yaml
          done
      - name: Build the five images and start the stack
        run: |
          node deploy/compose/generate-env.mjs
          $COMPOSE up -d --build --wait --wait-timeout 300
      - name: Smoke test through the published ports
        run: node deploy/compose/smoke-test.mjs
      - name: Restart; data and credentials survive
        run: |
          $COMPOSE down
          $COMPOSE up -d --wait --wait-timeout 300
          node deploy/compose/smoke-test.mjs
      - name: Switch the webhook to Vault Transit; existing credentials move over
        run: |
          $COMPOSE -f deploy/compose/vault-transit.yml up -d --build --wait --wait-timeout 300
          $COMPOSE -f deploy/compose/vault-transit.yml logs webhook | grep -E "key service vault-transit:transit/token-vault: ok"
          $COMPOSE -f deploy/compose/vault-transit.yml logs webhook | grep -E "re-encrypted [0-9]+ credential\(s\) under the current key vault-transit"
          node deploy/compose/smoke-test.mjs
      - name: Nothing but the two UIs is reachable from the host
        run: |
          for port in 4000 4100 4200 5432; do
            if (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null; then echo "port $port is exposed"; exit 1; fi
          done
      - name: Service logs
        if: failure()
        run: $COMPOSE -f deploy/compose/vault-transit.yml logs --no-color --tail 200
